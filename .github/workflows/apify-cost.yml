name: Lozatron Apify cost report

on:
  schedule:
    # Monday 08:00 America/New_York.
    - cron: "0 8 * * 1"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Compute the report without emailing it
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: lozatron-cost-report
  cancel-in-progress: false

jobs:
  report:
    if: vars.LOZATRON_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e . pytest
      - name: Test
        run: pytest -q
      - name: Send weekly Apify cost report
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_SENDER_EMAIL: ${{ secrets.GOOGLE_SENDER_EMAIL }}
          # Operational mail goes to the ops address, never to the brief's
          # reader. LOZ_CC_EMAILS is the fallback.
          LOZ_OPS_EMAILS: ${{ secrets.LOZ_OPS_EMAILS }}
          LOZ_CC_EMAILS: ${{ secrets.LOZ_CC_EMAILS }}
          LOZ_APIFY_DAILY_USD_CAP: ${{ vars.LOZ_APIFY_DAILY_USD_CAP }}
          LOZ_APIFY_MONTHLY_USD_CAP: ${{ vars.LOZ_APIFY_MONTHLY_USD_CAP }}
        timeout-minutes: 5
        run: lozatron --cost-report ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
