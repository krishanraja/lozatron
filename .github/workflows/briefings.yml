name: Lozatron briefings

on:
  schedule:
    # One brief a day, 9am Eastern -- but the hour here is UTC, always. Actions
    # cron has no timezone: a `timezone:` key beside it is accepted and then
    # ignored. The slot and its window live in schedule.py, in real Eastern time
    # with DST; these are only the knocks on the door.
    #
    # Every hour, from 13:23 to 02:23 UTC. Scheduled runs on this repository
    # have arrived up to seven hours late, and three knocks a day was not
    # enough: on 24 September the only one that ran arrived after the window
    # closed. With a knock every hour, one of them lands inside the window
    # however late the queue is running. The slot ledger caps delivery at one
    # per slot, so a knock whose slot is recorded exits in seconds having sent
    # nothing. Minute 23, not 0: the top of the hour is when every cron on
    # GitHub fires and when the queue is slowest.
    #
    # The evening knocks (00:23-02:23 UTC) run after the window closes. If the
    # day's brief never went out they fail the run, so a miss arrives as a
    # GitHub failure email instead of a green tick.
    - cron: "23 0-2,13-23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Fetch and rank without sending email
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: lozatron-delivery
  cancel-in-progress: false

jobs:
  briefing:
    if: vars.LOZATRON_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # The branch tip at run time, not the commit that was current when
          # the knock was queued. Knocks queue behind each other; a queued one
          # pinned to the older commit would read a ledger without the slot the
          # previous run just recorded, and send the brief a second time.
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e . pytest
      - name: Test
        run: pytest -q
      - name: Verify Gmail credentials
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: lozatron --mode briefing --verify-credentials
      - name: Run briefing
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_SENDER_EMAIL: ${{ secrets.GOOGLE_SENDER_EMAIL }}
          LOZ_RECIPIENT_EMAILS: ${{ secrets.LOZ_RECIPIENT_EMAILS }}
          LOZ_CC_EMAILS: ${{ secrets.LOZ_CC_EMAILS }}
          # Where the brief actually goes while reader delivery is switched off
          # in gmail.py. Without it the run would fail rather than send, which
          # is the right failure but a needless one.
          LOZ_OPS_EMAILS: ${{ secrets.LOZ_OPS_EMAILS }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          # The X scraper supplies the commentary layer -- what is being said
          # around the stories, in aggregate, never as entries. Roughly $0.21
          # a month at one run a day, inside the existing daily and monthly
          # caps. Set the variable to false to switch it off.
          LOZ_ENABLE_PAID_SOURCES: ${{ vars.LOZ_ENABLE_PAID_SOURCES || 'true' }}
          LOZ_PAID_MIN_FREE: ${{ vars.LOZ_PAID_MIN_FREE }}
          LOZ_APIFY_DAILY_USD_CAP: ${{ vars.LOZ_APIFY_DAILY_USD_CAP }}
          LOZ_APIFY_MONTHLY_USD_CAP: ${{ vars.LOZ_APIFY_MONTHLY_USD_CAP }}
          # The analyst. Live unless the variable explicitly says otherwise, so
          # the kill switch survives without needing to be set to go live.
          # Both keys travel; `LOZ_ANALYST_PROVIDER` decides which one is read.
          # Carrying the unused one costs nothing and makes swapping providers
          # a repository variable rather than a commit -- which is the whole
          # point of having two, and the difference between reverting a
          # substandard provider this morning and next week.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LOZ_ANALYST_PROVIDER: ${{ vars.LOZ_ANALYST_PROVIDER }}
          LOZ_ANALYST: ${{ vars.LOZ_ANALYST || 'live' }}
          LOZ_ANALYST_MODELS: ${{ vars.LOZ_ANALYST_MODELS }}
          LOZ_LLM_DAILY_USD_CAP: ${{ vars.LOZ_LLM_DAILY_USD_CAP }}
          LOZ_LLM_MONTHLY_USD_CAP: ${{ vars.LOZ_LLM_MONTHLY_USD_CAP }}
          LOZ_LLM_USD_PER_MTOK_IN: ${{ vars.LOZ_LLM_USD_PER_MTOK_IN }}
          LOZ_LLM_USD_PER_MTOK_OUT: ${{ vars.LOZ_LLM_USD_PER_MTOK_OUT }}
        timeout-minutes: 8
        run: lozatron --mode briefing ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
      - name: Save delivery state
        if: ${{ always() && (github.event_name == 'schedule' || inputs.dry_run == false) }}
        run: |
          if git diff --quiet -- state; then exit 0; fi
          git config user.name "lozatron[bot]"
          git config user.email "lozatron-bot@users.noreply.github.com"
          git add state
          git commit -m "state: record briefing delivery and paid-source use"
          # The email has already gone out by this point, so losing the push
          # means losing the dedup ledger and re-sending stories Lauren has
          # read. Rebase onto whatever landed meanwhile and retry before
          # failing loudly.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            sleep $((attempt * 5))
          done
          echo "::error title=DEDUP STATE LOST::Email was sent but delivery state could not be pushed."
          exit 1
