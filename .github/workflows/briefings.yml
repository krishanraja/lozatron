name: Lozatron briefings

on:
  schedule:
    - cron: "0 9,14,18 * * *"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Fetch and rank without sending email
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: lozatron-delivery
  cancel-in-progress: false

jobs:
  briefing:
    if: vars.LOZATRON_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e . pytest
      - name: Test
        run: pytest -q
      - name: Verify Gmail credentials
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: lozatron --mode briefing --verify-credentials
      - name: Run briefing
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_SENDER_EMAIL: ${{ secrets.GOOGLE_SENDER_EMAIL }}
          LOZ_RECIPIENT_EMAILS: ${{ secrets.LOZ_RECIPIENT_EMAILS }}
          LOZ_CC_EMAILS: ${{ secrets.LOZ_CC_EMAILS }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          LOZ_ENABLE_PAID_SOURCES: ${{ vars.LOZ_ENABLE_PAID_SOURCES }}
          LOZ_APIFY_DAILY_USD_CAP: ${{ vars.LOZ_APIFY_DAILY_USD_CAP }}
          LOZ_APIFY_MONTHLY_USD_CAP: ${{ vars.LOZ_APIFY_MONTHLY_USD_CAP }}
          # The analyst. Live unless the variable explicitly says otherwise, so
          # the kill switch survives without needing to be set to go live.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LOZ_ANALYST: ${{ vars.LOZ_ANALYST || 'live' }}
          LOZ_ANALYST_MODELS: ${{ vars.LOZ_ANALYST_MODELS }}
          LOZ_LLM_DAILY_USD_CAP: ${{ vars.LOZ_LLM_DAILY_USD_CAP }}
          LOZ_LLM_MONTHLY_USD_CAP: ${{ vars.LOZ_LLM_MONTHLY_USD_CAP }}
          LOZ_LLM_USD_PER_MTOK_IN: ${{ vars.LOZ_LLM_USD_PER_MTOK_IN }}
          LOZ_LLM_USD_PER_MTOK_OUT: ${{ vars.LOZ_LLM_USD_PER_MTOK_OUT }}
          LOZ_CLUSTERING: ${{ vars.LOZ_CLUSTERING || 'true' }}
        timeout-minutes: 8
        run: lozatron --mode briefing ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
      - name: Save delivery state
        if: ${{ always() && (github.event_name == 'schedule' || inputs.dry_run == false) }}
        run: |
          if git diff --quiet -- state; then exit 0; fi
          git config user.name "lozatron[bot]"
          git config user.email "lozatron-bot@users.noreply.github.com"
          git add state
          git commit -m "state: record briefing delivery and paid-source use"
          # The email has already gone out by this point, so losing the push
          # means losing the dedup ledger and re-sending stories Lauren has
          # read. Rebase onto whatever landed meanwhile and retry before
          # failing loudly.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            sleep $((attempt * 5))
          done
          echo "::error title=DEDUP STATE LOST::Email was sent but delivery state could not be pushed."
          exit 1
