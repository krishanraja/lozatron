name: Lozatron preview

# Manual only. Renders a real brief and sends it to the ops address, never to
# the brief's recipients, and never touches the delivery ledger.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Which brief to render
        required: true
        default: briefing
        type: choice
        options: [briefing]
      analyst:
        description: Analyst mode for this preview only
        required: true
        default: live
        type: choice
        options: [live, "off"]
      provider:
        description: Which analyst provider to render with
        required: true
        default: anthropic
        type: choice
        options: [anthropic, openai]

permissions:
  contents: read

concurrency:
  group: lozatron-preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e . pytest
      - name: Test
        run: pytest -q
      - name: Render and send preview
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_SENDER_EMAIL: ${{ secrets.GOOGLE_SENDER_EMAIL }}
          LOZ_OPS_EMAILS: ${{ secrets.LOZ_OPS_EMAILS }}
          LOZ_CC_EMAILS: ${{ secrets.LOZ_CC_EMAILS }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          # Both keys, so a preview can be rendered on either provider and the
          # two read side by side before the live brief is switched over.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LOZ_ANALYST_PROVIDER: ${{ inputs.provider }}
          LOZ_ANALYST: ${{ inputs.analyst }}
          LOZ_ANALYST_MODELS: ${{ vars.LOZ_ANALYST_MODELS }}
          LOZ_LLM_DAILY_USD_CAP: ${{ vars.LOZ_LLM_DAILY_USD_CAP }}
        timeout-minutes: 10
        run: lozatron --mode ${{ inputs.mode }} --preview
